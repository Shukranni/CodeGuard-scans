# Netlify configuration for the CodeGuard frontend.
#
# The publish directory is `build` because vite.config.mjs sets
# `build.outDir = "build"`.  The SPA rewrite is handled by
# `public/_redirects`, which Vite copies into the publish directory.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# VITE_API_BASE_URL must be set to the deployed Django API, e.g.
# https://codeguard-api.onrender.com
